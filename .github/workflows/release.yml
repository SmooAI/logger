name: Release (Changesets 🦋)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/logger -> rust/logger/target
          cache-on-failure: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install dependencies
        run: pnpm install

      - name: Guard — every manifest version matches package.json
        run: pnpm check:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Check, never rewrite. `pnpm format` here mutated the working tree without
      # ever committing the result, which left `cargo publish` staring at a dirty
      # tree — the reason `--allow-dirty` was needed in the first place.
      - name: Format check
        run: pnpm format:check

      - name: Version Update 🦋
        id: changesets
        uses: changesets/action@v1
        with:
          # Runs `changeset version && node scripts/sync-versions.mjs`. The action
          # commits the whole working tree afterwards, so the synced manifests land
          # in the version-bump commit instead of being discarded at publish time.
          version: pnpm run version
          commit: "🦋 New version release"
          title: "🦋 New version release"
          publish: pnpm ci:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

      # Gate each registry on whether IT is behind, not on whether npm published
      # in THIS run. `steps.changesets.outputs.published` is only true when the
      # publish command actually shipped something, so a run that died after npm
      # left PyPI/crates.io/Go/NuGet behind, and the NEXT run had no changesets
      # left, reported published=false, skipped all four, and went GREEN having
      # published nothing. That is how 4.5.1 and 4.5.2 stranded three registries
      # at 4.5.0 here. Asking each registry directly also makes a re-run heal it.
      - name: Which registries are behind package.json?
        id: lag
        env:
          CHANGESETS_PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "Target version: ${VERSION}"

          # Is ${VERSION} actually released? Two independent yeses, because
          # neither alone is sufficient:
          #
          #   - changesets published it in THIS run. Authoritative immediately,
          #     and necessary because npm reads are eventually consistent: a
          #     `npm view` moments after a successful publish still 404s, which
          #     skipped all four steps for 4.5.4 and left them a version behind.
          #   - npm already serves it. This is the backfill path — it lets a
          #     re-run catch up registries that an earlier run left behind.
          #
          # Neither true means package.json is bumped but unreleased. The
          # changesets action leaves the workspace on the version branch, so in a
          # run that only OPENS the version PR this is exactly the case, and
          # publishing here would ship ahead of npm from an unmerged branch.
          if [ "${CHANGESETS_PUBLISHED:-false}" = "true" ]; then
            echo "changesets published ${VERSION} in this run."
          elif npm view "@smooai/logger@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already serves ${VERSION} — checking the others for backfill."
          else
            echo "${VERSION} is not released (not published here, not on npm) — nothing to do."
            {
              echo "pypi=no"; echo "crates=no"; echo "nuget=no"; echo "gotag=no"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "behind" = this registry does NOT already have ${VERSION}.
          # A failed/garbled lookup counts as behind, i.e. we try to publish:
          # every path below is duplicate-tolerant or version-guarded, so a
          # redundant attempt is cheap and a skipped one loses a release.
          behind() {
            if jq -e --arg v "$VERSION" "$2" >/dev/null 2>&1 <<<"$1"; then echo no; else echo yes; fi
          }

          PYPI=$(behind "$(curl -sfL https://pypi.org/pypi/smooai-logger/json || true)" '.releases | has($v)')
          CRATES=$(behind "$(curl -sfL -H 'User-Agent: SmooAI-logger-release' https://crates.io/api/v1/crates/smooai-logger/versions || true)" '[.versions[].num] | index($v)')
          NUGET=$(behind "$(curl -sfL https://api.nuget.org/v3-flatcontainer/smooai.logger/index.json || true)" '.versions | index($v)')
          if git ls-remote --exit-code --tags origin "refs/tags/go/v${VERSION}" >/dev/null 2>&1; then GOTAG=no; else GOTAG=yes; fi

          echo "behind -> pypi:${PYPI} crates:${CRATES} nuget:${NUGET} go-tag:${GOTAG}"
          {
            echo "pypi=${PYPI}"
            echo "crates=${CRATES}"
            echo "nuget=${NUGET}"
            echo "gotag=${GOTAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish smooai-logger to PyPI
        if: steps.lag.outputs.pypi == 'yes'
        working-directory: python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}
        run: |
          # Clean stale build artifacts to prevent re-uploading old versions
          rm -rf dist/
          uv run poe publish

      - name: Publish smooai-logger to crates.io
        if: steps.lag.outputs.crates == 'yes'
        run: cargo publish --locked --manifest-path rust/logger/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

      - name: Tag and publish Go module
        if: steps.lag.outputs.gotag == 'yes'
        run: |
          # Guard here, not just in the pre-flight checks: changesets has
          # bumped package.json by this point, so this is the only place the
          # version that becomes the tag can be compared to the manifests and
          # to the Go module path.
          pnpm check:versions
          VERSION=$(node -p "require('./package.json').version")
          TAG="go/v${VERSION}"
          echo "Creating Go module tag: ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Go module tagged and pushed: ${TAG}"

      - name: Build and test .NET
        if: steps.lag.outputs.nuget == 'yes'
        working-directory: dotnet
        run: |
          dotnet restore SmooAI.Logger.sln
          dotnet build SmooAI.Logger.sln -c Release --no-restore
          dotnet test SmooAI.Logger.sln -c Release --no-build --nologo

      - name: Pack and publish SmooAI.Logger to NuGet
        if: steps.lag.outputs.nuget == 'yes'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packing SmooAI.Logger ${VERSION}"
          dotnet pack dotnet/src/SmooAI.Logger/SmooAI.Logger.csproj \
            --configuration Release \
            -p:Version=${VERSION} \
            -p:PackageVersion=${VERSION} \
            -o dotnet/artifacts
          for pkg in dotnet/artifacts/*.nupkg; do
            echo "Pushing $pkg to NuGet..."
            dotnet nuget push "$pkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Auto-Merge Changeset PR
        run: |
          PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open Changeset PR found, skipping merge."
            exit 0
          fi

          echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."

          # `--auto` queues the merge behind pending checks, but GitHub REFUSES to
          # enable it once a PR is already green:
          #   GraphQL: Pull request is in clean status (enablePullRequestAutoMerge)
          # That used to be unreachable because PR checks took ~20 minutes; they now
          # take ~2, so the changeset PR is routinely green before this step runs and
          # the whole release run reports failure even though it published fine.
          # Fall back to merging outright — but only after confirming the checks are
          # green, so this never merges over a red lane.
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            # The merge push automatically triggers the Release workflow
            # so no need to manually re-trigger it
            exit 0
          fi

          echo "Auto-merge was refused; checking whether #$PR_NUMBER is already green."
          # Deliberately NOT `gh pr checks --required`: this repo has no required
          # checks configured, so that would return an empty list and read as green.
          # Every lane must be pass/skipping, and there must be at least one.
          BUCKETS=$(gh pr checks "$PR_NUMBER" --json bucket --jq '[.[].bucket] | join(" ")' || echo "")
          echo "Check buckets: [$BUCKETS]"
          if [[ -z "$BUCKETS" ]] || [[ -n "$(tr ' ' '\n' <<<"$BUCKETS" | grep -vx -e pass -e skipping)" ]]; then
            echo "::error::Changeset PR #$PR_NUMBER is not green ([$BUCKETS]); refusing to merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
