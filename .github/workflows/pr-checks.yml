name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Toolchains come from mise.toml, read here by mise-action so the runner
      # and a developer's shell resolve identical versions.
      - name: Setup toolchains (mise)
        uses: jdx/mise-action@v4

      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/logger -> rust/logger/target
          cache-on-failure: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install dependencies
        run: pnpm install

      - name: Sync Python dependencies
        run: uv sync --group dev
        working-directory: python

      - name: Guard — every manifest version matches package.json
        run: pnpm check:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: .NET build + test
        run: |
          dotnet restore SmooAI.Logger.sln
          dotnet build SmooAI.Logger.sln -c Release --no-restore
          dotnet test SmooAI.Logger.sln -c Release --no-build --nologo
        working-directory: dotnet
